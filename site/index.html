<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Radar 日报</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:16px;color:#222}
h1{font-size:22px}h2{font-size:18px;margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f5f5f5}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.new{background:#2a9d48}.revived{background:#d97b1a}.spike{background:#8a63d2}.watch{background:#888}.pending{background:#4d6b8a}
#filters button{margin:2px;padding:4px 10px;cursor:pointer}
#sort{margin:2px 0 8px;padding:4px 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.card{border:1px solid #ddd;border-radius:8px;padding:10px;background:#fff}.card summary{cursor:pointer;font-weight:600}
.metric{font-size:12px;color:#555;margin:6px 0}.tier{float:right;font-size:11px;color:#666}
.note{color:#666;font-size:12px}
.badge{display:inline-block;border:1px solid #ccd3dc;border-radius:10px;padding:1px 7px;margin:2px 3px 2px 0;font-size:11px;color:#46515d;background:#f7f9fb}
</style>
</head>
<body>
<h1>Trend Radar 新词日报</h1>
<p class="note" id="meta">加载中…</p>
<h2>今日 Top 10</h2><ol id="top10"></ol>
<h2>主榜事件</h2><div class="cards" id="main"></div>
<h2>娱乐 / 观察</h2><div class="cards" id="watch"></div>
<details><summary>低信号附录</summary><div class="cards" id="low_signal"></div></details>
<details><summary>查看全部候选词</summary>
<div id="filters">
<button data-v="all">全部</button><button data-v="new">新词</button><button data-v="revived">二次爆火</button><button data-v="spike">短时尖峰</button><button data-v="watch">待观察</button><button data-v="pending">待复核</button>
</div>
<label>排序：<select id="sort"><option value="growth">涨幅（高→低）</option><option value="volume">相对搜索量（vs gpts，高→低）</option></select></label>
<h2>候选词</h2>
<table id="tbl"><thead><tr><th>词</th><th>结论</th><th>涨幅</th><th>搜索意图</th><th>关联</th><th>采集/有效词根</th><th>vs gpts</th><th>备注</th></tr></thead><tbody></tbody></table>
</details>
<p class="note">娱乐性信息固定进入待观察。搜索量排序使用同图 7 天 vs gpts 相对倍数，不是绝对月搜索量。假设类字段为运行假设（hypothesis），非已确认事实。</p>
<script>
const CN={new:"新词",revived:"老词二次爆火",spike:"短时尖峰",watch:"待观察",pending:"待复核"};
const INTENT={local_commercial:"本地商业",navigation:"导航",educational_content:"教育内容",tool_product:"工具/产品",informational:"信息查询",commercial_research:"商业调研",unclassified:"未分类"};
const REL={direct:"直接关联",evidence:"证据确认",behavioral_unverified:"行为关联待核验"};
let C=[],V="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
fetch("data/daily.json").then(r=>r.json()).then(d=>{
  document.getElementById("meta").textContent=
    `更新：${d.updated_at} · 词根 ${d.stats.roots_cached}/${d.stats.roots_total} · 候选 ${d.stats.candidates} · 已复核 ${d.stats.reviewed}（${(d.stats.review_coverage*100).toFixed(1)}%） · 有效待复核 ${d.stats.eligible_pending} · 已排除 ${d.stats.excluded_from_review} · 断点窗口 ${d.stats.review_progress_windows}${d.stats.backlog_mode?" · 积压优先模式":""} · 事件 ${d.stats.active_clusters} · 请求 ${d.stats.requests}${d.stats.rate_limited?" · 429后已保存进度":""}`;
  C=d.candidates;
  render("all");
  document.getElementById("top10").innerHTML=(d.top10||d.top5||[]).map(c=>`<li><b>${esc(c.cluster_name)}</b>：${c.breakout?"飙升":"+"+(c.growth||0)+"%"}，${c.roots} 个来源词根</li>`).join("");
  ["main","watch","low_signal"].forEach(tier=>renderClusters(d.clusters.filter(c=>c.tier===tier),tier));
});
function renderClusters(items,id){
  document.getElementById(id).innerHTML=items.map(c=>`<details class="card"><summary>${esc(c.canonical_term)} <span class="tier">${esc(c.stage)}</span></summary><div><span class="badge">${esc((c.search_intents||[]).map(x=>INTENT[x]||x).join(" / ")||"未分类")}</span><span class="badge">${esc(REL[c.relation_status]||c.relation_status)}</span><span class="badge">${c.review_status==="reviewed"?"已复核":"待复核"}</span><span class="badge">竞品未核验</span></div><div class="metric">展示词：${esc(c.display_term)} · 峰值：${c.breakout?"飙升":"+"+(c.max_growth||0)+"%"} · 变体 ${c.variant_count} · 采集/有效词根 ${c.raw_source_root_count||0}/${c.relevant_root_count||0}</div><div class="metric">${esc(c.first_seen_date)} → ${esc(c.last_active_date)} · ${esc(c.tier_reason||"")}${c.entertainment?" · 娱乐":""}</div><div>${c.variants.map(v=>esc(v.term)).join("、")}</div></details>`).join("")||'<p class="note">暂无</p>';
}
function render(v){
  V=v;
  const tb=document.querySelector("#tbl tbody");tb.innerHTML="";
  const score=c=>document.getElementById("sort").value==="volume"
    ?(Number.isFinite(c.vs_gpts)?c.vs_gpts:-1)
    :(c.breakout?Number.MAX_VALUE:(Number.isFinite(c.growth)?c.growth:-1));
  C.filter(c=>v==="all"||c.verdict===v).sort((a,b)=>score(b)-score(a)||a.q.localeCompare(b.q)).forEach(c=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><a href="https://trends.google.com/trends/explore?date=now%207-d&q=${encodeURIComponent(c.q)}" target="_blank" rel="noopener">${esc(c.q)}</a></td><td><span class="tag ${esc(c.verdict)}">${esc(CN[c.verdict])}</span></td><td>${esc(c.formatted||"—")}</td><td>${esc(INTENT[c.search_intent]||c.search_intent)}</td><td>${esc(REL[c.relation_status]||c.relation_status)}</td><td>${esc((c.raw_source_root_count||0)+"/"+(c.relevant_root_count||0))}</td><td>${esc(c.vs_gpts_display||"—")}</td><td>${esc(c.note||"")}</td>`;
    tb.appendChild(tr);
  });
}
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>render(b.dataset.v));
document.getElementById("sort").onchange=()=>render(V);
</script>
</body>
</html>
