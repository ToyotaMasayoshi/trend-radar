name: Daily radar

on:
  push:
    branches: [main]
    paths-ignore:
      - "state/nodes/**"
  schedule:
    # Every 15 minutes, offset from GitHub Actions' busiest top-of-hour window.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: trend-radar-state
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore collection state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/state.json
            state/roots.json
          key: trend-radar-state-${{ github.run_id }}
          restore-keys: trend-radar-state-
      - run: python3 -B scripts/merge_nodes.py
      - run: python3 -B scripts/test_pipeline.py
      - run: python3 -B scripts/github_radar_watch.py
      - run: python3 -B scripts/collect.py --shard-count 2 --shard-index 0 --collector-id github
      - run: python3 -B scripts/cluster.py
      - run: python3 -B scripts/report.py
      - run: cp state/roots.json site/data/roots.json
      - name: Save collection and cluster history
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            state/state.json
            state/roots.json
          key: trend-radar-state-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler pages deploy site --project-name trend-radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
