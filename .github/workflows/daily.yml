name: Daily radar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore collection state
        uses: actions/cache/restore@v4
        with:
          path: state/state.json
          key: trend-radar-state-${{ github.run_id }}
          restore-keys: trend-radar-state-
      - run: python3 -B scripts/test_pipeline.py
      - run: python3 -B scripts/collect.py
      - name: Save collection state
        if: always() && hashFiles('state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state/state.json
          key: trend-radar-state-${{ github.run_id }}
      - run: python3 -B scripts/cluster.py
      - run: python3 -B scripts/report.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler pages deploy site --project-name trend-radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
