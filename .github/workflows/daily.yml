name: Daily radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B scripts/test_pipeline.py
      - run: python3 -B scripts/collect.py
      - run: python3 -B scripts/cluster.py
      - run: python3 -B scripts/report.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler pages deploy site --project-name trend-radar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
